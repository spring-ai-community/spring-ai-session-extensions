<rect x="146" y="482" width="150" height="42" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221" y="507.5" text-anchor="middle" font-size="14">ChatModel</text>
