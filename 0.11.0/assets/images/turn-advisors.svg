<path d="M549 153 L549 162" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#turn-advisors-arrow)"/>
<path d="M388 187 L417 187" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#turn-advisors-arrow)"/>
<rect x="420" y="222" width="258" height="46" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="549" y="242" text-anchor="middle" font-size="13" font-weight="600">ToolCallingManager &amp; Tools</text><text x="549" y="259" text-anchor="middle" font-size="11" fill-opacity="0.75">some need a person's confirmation</text>
