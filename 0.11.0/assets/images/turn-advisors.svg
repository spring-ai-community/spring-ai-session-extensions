<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 536" width="700" class="turn-advisors" role="img" aria-labelledby="turn-advisors-title turn-advisors-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="currentColor">
<defs><marker id="turn-advisors-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" fill-opacity="0.6"/></marker></defs>
<title id="turn-advisors-title">Turns in the ChatClient</title>
<desc id="turn-advisors-desc">The advisor chain of a ChatClient with the TurnStatusAdvisor of this project in front of the Spring AI session advisors and its TurnInterruptAdvisor behind them. TurnStatusAdvisor runs once per call: it starts, parks, resumes and ends the turn through the TurnService, which writes TURN events through the SessionService. SessionTurnAdvisor runs once per call: it creates the session and compacts it. ToolCallingAdvisor runs the loop and the tools through the ToolCallingManager, and pauses on a tool call that needs a confirmation; for each tool round the rest of the chain runs again. SessionMemoryAdvisor stores the messages and builds the prompt on every round. TurnInterruptAdvisor of this project checks on every round that the turn still runs, and stops the loop after an interrupt. ChatModelCallAdvisor, the last advisor, calls the chat model. The Spring AI advisors are unchanged.</desc>
<text x="350" y="30" text-anchor="middle" font-size="20" font-weight="700">Turns in the <tspan fill="#6DB33F">ChatClient</tspan></text>
<rect x="8" y="50" width="684" height="410" rx="12" fill="#6DB33F" fill-opacity="0.05" stroke="#6DB33F" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="24" y="72" text-anchor="start" font-size="13.5" font-weight="700" fill="#6DB33F">The advisor chain of a ChatClient</text>
<text x="221" y="96" text-anchor="middle" font-size="12" fill-opacity="0.75" font-style="italic">advisors, by order (HIGHEST_PRECEDENCE + n)</text>
<rect x="56" y="106" width="330" height="46" rx="8" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="221" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#3F7DE0">TurnStatusAdvisor</text><text x="221" y="143" text-anchor="middle" font-size="11" fill-opacity="0.75">once per call: starts, parks, resumes, ends the turn</text><text x="378" y="122" text-anchor="end" font-size="10" fill-opacity="0.6">+100</text>
<rect x="56" y="164" width="330" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221" y="184" text-anchor="middle" font-size="13" font-weight="600">SessionTurnAdvisor</text><text x="221" y="201" text-anchor="middle" font-size="11" fill-opacity="0.75">once per call: creates the session, compacts</text><text x="378" y="180" text-anchor="end" font-size="10" fill-opacity="0.6">+200</text>
<rect x="56" y="222" width="330" height="46" rx="8" fill="#6DB33F"/><text x="221" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ToolCallingAdvisor</text><text x="221" y="259" text-anchor="middle" font-size="11" fill="#fff">the loop: runs tools, pauses on a confirmation</text><text x="378" y="238" text-anchor="end" font-size="10" fill="#fff" fill-opacity="0.85">+300</text>
<rect x="56" y="280" width="330" height="46" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="221" y="300" text-anchor="middle" font-size="13" font-weight="600">SessionMemoryAdvisor</text><text x="221" y="317" text-anchor="middle" font-size="11" fill-opacity="0.75">every round: stores the messages, builds the prompt</text><text x="378" y="296" text-anchor="end" font-size="10" fill-opacity="0.6">+1000</text>
<rect x="56" y="338" width="330" height="46" rx="8" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="221" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#3F7DE0">TurnInterruptAdvisor</text><text x="221" y="375" text-anchor="middle" font-size="11" fill-opacity="0.75">every round: stops the loop after an interrupt</text><text x="378" y="354" text-anchor="end" font-size="10" fill-opacity="0.6">+1100</text>
<rect x="56" y="396" width="330" height="46" rx="8" fill="#6DB33F"/><text x="221" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ChatModelCallAdvisor</text><text x="221" y="433" text-anchor="middle" font-size="11" fill="#fff">calls the model</text><text x="378" y="412" text-anchor="end" font-size="10" fill="#fff" fill-opacity="0.85">last</text>
